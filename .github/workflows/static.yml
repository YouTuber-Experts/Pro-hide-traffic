# Workflow for building and deploying the React + Vite application to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main", "master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure Firebase config file exists for build
        run: |
          if [ ! -f firebase-applet-config.json ]; then
            echo '{"projectId":"demo-project","appId":"","apiKey":"","authDomain":"","storageBucket":"","messagingSenderId":"","measurementId":"","oAuthClientId":"","recaptchaSiteKey":""}' > firebase-applet-config.json
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite production bundle
        run: npm run build

      - name: Create SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload compiled production dist folder instead of raw .tsx source
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
